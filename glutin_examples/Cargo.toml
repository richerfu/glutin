[package]
name = "glutin_examples"
version = "0.1.3"
authors = ["Kirill Chibisov <contact@kchibisov.com>"]
description = "Examples for glutin"
repository = "https://github.com/rust-windowing/glutin"
license = "Apache-2.0"
readme = "../README.md"
rust-version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["egl", "glx", "x11", "wayland", "wgl"]
egl = ["glutin-winit/egl", "png"]
glx = ["glutin-winit/glx"]
wgl = ["glutin-winit/wgl"]
x11 = ["glutin-winit/x11"]
wayland = ["glutin-winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]

[dependencies]
glutin = { path = "../glutin", default-features = false }
glutin-winit = { path = "../glutin-winit", default-features = false }
png = { version = "0.18.1", optional = true }
raw-window-handle = "0.6"
winit = { version = "0.31.0-beta.3", default-features = false }
drm = { version = "0.15", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.31.0-beta.3", default-features = false, features = ["android-native-activity"] }

[target.'cfg(target_env = "ohos")'.dependencies]
log = "0.4"
openharmony-ability = { version = "1.0.0-beta.2", git = "https://github.com/richerfu/openharmony-ability.git", rev = "d8cf549505fca3ea39d4a56cb58334a85a6d1dc6" }
openharmony-ability-derive = { version = "1.0.0-beta.1", git = "https://github.com/richerfu/openharmony-ability.git", rev = "d8cf549505fca3ea39d4a56cb58334a85a6d1dc6" }
napi-ohos = { version = "1.2", features = ["napi8"] }
napi-derive-ohos = "1.2"

[build-dependencies]
napi-build-ohos = "1.2"
gl_generator = "0.14"
cfg_aliases = "0.2.1"

[[example]]
name = "android"
crate-type = ["cdylib"]

[[example]]
name = "ohos"
crate-type = ["cdylib"]
required-features = ["egl"]

[[example]]
name = "egl_device"
required-features = ["egl"]

[[example]]
name = "drm"
required-features = ["egl", "drm"]
